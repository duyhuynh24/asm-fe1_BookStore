<div class="container py-4">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-3 mb-4">
      <div class="sidebar bg-white border rounded p-3 shadow-sm">
        <h5 class="mb-3">Danh mục</h5>
        <ul class="list-group list-group-flush">
          <li class="list-group-item">Tin tức</li>
          <li class="list-group-item">Review sách</li>
          <li class="list-group-item">Khuyến mãi</li>
        </ul>
      </div>
    </div>

    <!-- Danh sách bài viết -->
    <div class="col-md-9">
      <div class="row row-cols-1 g-4">
        <div class="col" *ngFor="let post of posts">
          <div class="card post-card border-0 shadow-sm">
            <div class="row g-0">
              <div class="col-md-4">
                <img [src]="post.image" class="img-fluid rounded-start h-100 object-fit-cover" alt="Post Image" />
              </div>
              <div class="col-md-8">
                <div class="card-body">
                  <h5 class="card-title">{{ post.title }}</h5>
                  <p class="card-text text-muted small">{{ post.date }}</p>
                  <p class="card-text">{{ post.description }}</p>
                  <a  class="btn btn-sm btn-outline-primary mt-2">Xem chi tiết</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
