<div class="products-page container mt-4">
  <div class="row">

    <!-- Bộ lọc bên trái -->
    <div class="col-md-3 filter-sidebar">
      <div class="filter-box p-3 border rounded mb-4 bg-light">
        <h5 class="filter-title mb-3">📚 Danh mục</h5>
        <ul class="list-group category-list">
          <li class="list-group-item">Tất cả</li>
          <li class="list-group-item">Tiểu thuyết</li>
          <li class="list-group-item">Kinh tế</li>
          <li class="list-group-item">Kỹ năng sống</li>
          <li class="list-group-item">Thiếu nhi</li>
        </ul>
      </div>

      <div class="filter-box p-3 border rounded bg-light">
        <h5 class="filter-title mb-3">💰 Giá tiền</h5>
        <ul class="list-group price-list">
          <li class="list-group-item">Dưới 100.000đ</li>
          <li class="list-group-item">100.000đ - 200.000đ</li>
          <li class="list-group-item">Trên 200.000đ</li>
        </ul>
      </div>
    </div>

    <!-- Danh sách sản phẩm -->
    <div class="col-md-9 product-list">
      <div class="product-wrapper p-4 bg-white border rounded shadow-sm">
        <h4 class="section-title mb-4">📖 Tất cả sách</h4>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
          <!-- Book Card -->
          <div class="col" *ngFor="let book of books">
            <div class="card book-card h-100 border-0 shadow-sm">
              <img src="/assets/images/sample-book.jpg" class="card-img-top book-image" alt="Book">
              <div class="card-body">
                <h5 class="card-title book-title">{{ book.title }}</h5>
                <p class="card-text book-description">{{ book.description }}</p>
              </div>
              <div class="card-footer d-flex justify-content-between align-items-center bg-white border-top">
                <span class="book-price fw-bold text-danger">{{ book.price | number }} đ</span>
                <div class="d-flex gap-2">
                  <button class="btn btn-sm btn-outline-primary">Mua ngay</button>
                  <button class="btn btn-sm btn-secondary">Xem chi tiết</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>



  </div>
</div>
