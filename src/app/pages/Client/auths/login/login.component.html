<div class="auth-wrapper">
  <div class="auth-box">
    <h3 class="auth-title text-primary">Đăng Nhập</h3>
    <form>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          [(ngModel)]="email"
          name="email"
          placeholder="Nhập email"
        />
      </div>
      <div class="mb-3">
        <label class="form-label">Mật khẩu</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          placeholder="Nhập mật khẩu"
        />
      </div>
      <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
    </form>
    <div class="text-center mt-3">
      <small>Chưa có tài khoản?
        <a routerLink="../register" class="text-primary text-decoration-none">Đăng ký</a>
      </small>
    </div>
  </div>
</div>
