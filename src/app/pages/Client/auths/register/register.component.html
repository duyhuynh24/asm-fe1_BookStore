<div class="auth-wrapper">
  <div class="auth-box">
    <h3 class="auth-title text-success">Đăng Ký</h3>
    <form>
      <div class="mb-3">
        <label class="form-label">Họ và tên</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="username"
          name="username"
          placeholder="Nhập họ tên"
        />
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          [(ngModel)]="email"
          name="email"
          placeholder="Nhập email"
        />
      </div>
      <div class="mb-3">
        <label class="form-label">Mật khẩu</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          placeholder="Nhập mật khẩu"
        />
      </div>
      <button class="btn btn-success w-100" type="submit">Đăng ký</button>
    </form>
    <div class="text-center mt-3">
      <small>Đã có tài khoản?
        <a routerLink="/client/login" class="text-success text-decoration-none">Đăng nhập</a>
      </small>
    </div>
  </div>
</div>
