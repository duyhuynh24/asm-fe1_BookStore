<div class="register-box">
  <div class="register-box__container">
    <h3 class="register-box__title">Đăng Ký</h3>
    <form>
      <div class="register-box__form-group mb-3">
        <label class="register-box__label">Họ và tên</label>
        <input
          type="text"
          class="register-box__input form-control"
          [(ngModel)]="username"
          name="username"
          placeholder="Nhập họ tên"
        />
      </div>
      <div class="register-box__form-group mb-3">
        <label class="register-box__label">Email</label>
        <input
          type="email"
          class="register-box__input form-control"
          [(ngModel)]="email"
          name="email"
          placeholder="Nhập email"
        />
      </div>
      <div class="register-box__form-group mb-3">
        <label class="register-box__label">Mật khẩu</label>
        <input
          type="password"
          class="register-box__input form-control"
          [(ngModel)]="password"
          name="password"
          placeholder="Nhập mật khẩu"
        />
      </div>
      <button class="register-box__button btn w-100" type="submit">Đăng ký</button>
    </form>
    <div class="register-box__footer text-center mt-3">
      <small>Đã có tài khoản?
      </small>
      <a routerLink="/login" class="register-box__link">Đăng nhập</a>
    </div>
  </div>
</div>
