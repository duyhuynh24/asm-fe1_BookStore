<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Thêm Người Dùng</h5>
    </div>
    <div class="card-body">
      <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
        <!-- Tên Người Dùng -->
        <div class="mb-3">
          <label class="form-label fw-bold">Tên Người Dùng</label>
          <input type="text" class="form-control" formControlName="name" placeholder="Nhập tên người dùng">
          <div *ngIf="f['name'].invalid && f['name'].touched" class="text-danger">
            <small *ngIf="f['name'].errors?.['required']">Tên người dùng không được bỏ trống</small>
            <small *ngIf="f['name'].errors?.['minlength']">Ít nhất 3 ký tự</small>
            <small *ngIf="f['name'].errors?.['maxlength']">Không quá 50 ký tự</small>
            <small *ngIf="f['name'].errors?.['forbiddenName']">Tên người dùng không hợp lệ</small>
          </div>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label class="form-label fw-bold">Email</label>
          <input type="email" class="form-control" formControlName="email" placeholder="Nhập email">
          <div *ngIf="f['email'].invalid && f['email'].touched" class="text-danger">
            <small *ngIf="f['email'].errors?.['required']">Email không được bỏ trống</small>
            <small *ngIf="f['email'].errors?.['email']">Email không đúng định dạng</small>
          </div>
        </div>

        <!-- Số điện thoại -->
        <div class="mb-3">
          <label class="form-label fw-bold">Số điện thoại</label>
          <input type="text" class="form-control" formControlName="phone" placeholder="Nhập số điện thoại">
        </div>

        <!-- Địa chỉ -->
        <div class="mb-3">
          <label class="form-label fw-bold">Địa chỉ</label>
          <input type="text" class="form-control" formControlName="address" placeholder="Nhập địa chỉ">
        </div>

        <!-- Mật khẩu -->
        <div class="mb-3">
          <label class="form-label fw-bold">Mật khẩu</label>
          <input type="password" class="form-control" formControlName="password" placeholder="Nhập mật khẩu">
          <div *ngIf="f['password'].invalid && f['password'].touched" class="text-danger">
            <small *ngIf="f['password'].errors?.['required']">Không được bỏ trống</small>
            <small *ngIf="f['password'].errors?.['minlength']">Ít nhất 6 ký tự</small>
          </div>
        </div>

        <!-- Vai Trò -->
        <div class="mb-3">
          <label class="form-label fw-bold">Vai Trò</label>
          <select class="form-select" formControlName="role">
            <option value="" disabled>Chọn vai trò</option>
            <option value="admin">Admin</option>
            <option value="user">User</option>
          </select>
          <div *ngIf="f['role'].invalid && f['role'].touched" class="text-danger">
            <small *ngIf="f['role'].errors?.['required']">Vui lòng chọn vai trò</small>
          </div>
        </div>

        <!-- Nút Lưu và Hủy -->
        <div class="text-center mt-4">
          <button type="submit" class="btn btn-outline-warning" [disabled]="userForm.invalid">Lưu</button>
          <button type="button" class="btn btn-secondary ms-2" [routerLink]="['/ui-components/users']">Hủy</button>
        </div>
      </form>
    </div>
  </div>
</div>
