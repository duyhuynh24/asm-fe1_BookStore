<div class="container mt-4">
  <!-- Khung bao trọn toàn bộ danh sách người dùng -->
  <div class="card shadow-sm border-light">
    <div class="card-header bg-primary text-white text-center">
      <h5 class="mb-0 text-uppercase" style="letter-spacing: 1px;">Quản Lý Người Dùng</h5>
    </div>
    <div class="card-body">

      <!-- Kiểm tra danh sách rỗng -->
      <div *ngIf="users.length === 0" class="text-center text-muted">
        <p>Không có người dùng nào.</p>
      </div>

      <!-- Danh sách người dùng -->
      <div class="row" *ngIf="users.length > 0">
        <div class="col-md-4 mb-4" *ngFor="let user of users; let i = index">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body">
              <h5 class="card-title text-primary fw-bold">{{ user.name }}</h5>
              <p class="card-text"><strong>Email:</strong> {{ user.email }}</p>
              <p class="card-text"><strong>Số điện thoại:</strong> {{ user.phone }}</p>
              <p class="card-text"><strong>Địa chỉ:</strong> {{ user.address }}</p>
              <p class="card-text"><strong>Vai trò:</strong> {{ user.role }}</p>
              <div class="d-flex justify-content-between">
                <!-- Nút Sửa -->
                <button
                  class="btn btn-outline-warning btn-sm"
                  [routerLink]="['/ui-components/users/edit', user.id]">
                  Sửa
                </button>

                <!-- Nút Xóa -->
                <button
                  class="btn btn-outline-danger btn-sm"
                  (click)="onDeleteUser(user.id)">
                  Xóa
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
