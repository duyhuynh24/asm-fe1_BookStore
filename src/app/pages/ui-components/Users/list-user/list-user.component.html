<div class="container mt-4">
    <h2 class="mb-3">Danh Sách Người Dùng</h2>
    <!-- <button class="btn btn-primary mb-3" [routerLink]="['/ui-components/users/add']">Thêm Người Dùng</button> -->
    <!-- <button class="btn btn-primary mb-3" [routerLink]="['/ui-components/users/add']">Thêm Người Dùng</button> -->
  
    <table class="table table-bordered">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Tên Người Dùng</th>
          <th>Email</th>
          <th>Vai Trò</th>
          <th>Hành Động</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.role }}</td>
          <td>
            <button class="btn btn-warning me-2" [routerLink]="['/ui-components/users/edit', user.id]">Sửa</button>
            <button class="btn btn-danger" >Xóa</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
