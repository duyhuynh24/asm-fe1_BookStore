<!-- Quản lý Danh Mục với Bootstrap -->
<div class="container mt-4">
  <div class="card shadow-sm border-light">
    <div class="card-header bg-primary text-white">
      <h2 class="mb-0">Quản Lý Danh Mục</h2>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover table-bordered">
          <thead class="table-dark">
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Tên Danh Mục</th>

            <th scope="col" class="col-2 text-center">Hành Động</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let category of categories">
            <td>{{ category.id }}</td>
            <td>{{ category.name }}</td>

            <td class="text-center">
              <div class="btn-group">
                <button class="btn btn-warning btn-sm" [routerLink]="['/ui-components/category/edit', category.id]">
                  Sửa
                </button>
                <button class="btn btn-danger btn-sm ms-1" (click)="onDeleteCategory(category.id)">
                  Xóa
                </button>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
