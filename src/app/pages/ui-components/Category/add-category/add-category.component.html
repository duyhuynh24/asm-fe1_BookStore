<div class="container mt-4">
  <!-- Loading indicator -->
  <div *ngIf="isLoading" class="text-center mb-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Error message -->
  <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
    {{ errorMessage }}
  </div>

  <!-- Success message -->
  <div *ngIf="successMessage" class="alert alert-success" role="alert">
    {{ successMessage }}
  </div>

  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">Thêm danh mục mới</h4>
    </div>
    <div class="card-body">
      <form (ngSubmit)="onSubmit()" #categoryForm="ngForm">
        <div class="mb-3">
          <label for="categoryName" class="form-label">Tên danh mục <span class="text-danger">*</span></label>
          <input
            type="text"
            id="categoryName"
            name="name"
            class="form-control"
            [(ngModel)]="category.name"
            required
            #name="ngModel"
            [class.is-invalid]="name.invalid && (name.dirty || name.touched)"
            placeholder="Nhập tên danh mục"
          />
          <div class="invalid-feedback" *ngIf="name.invalid && (name.dirty || name.touched)">
            Vui lòng nhập tên danh mục
          </div>
        </div>

        <div class="mb-3">
          <label for="categoryDescription" class="form-label">Mô tả</label>
          <textarea
            id="categoryDescription"
            name="description"
            class="form-control"
            [(ngModel)]="category.description"
            rows="3"
            placeholder="Nhập mô tả danh mục"
          ></textarea>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="categoryForm.invalid || isLoading"
          >
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1"></span>
            Thêm mới
          </button>
          <button type="button" class="btn btn-secondary" (click)="onCancel()">
            Hủy
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
