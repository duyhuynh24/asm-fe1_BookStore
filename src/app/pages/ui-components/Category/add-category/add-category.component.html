<div class="container mt-4">
    <div class="card shadow-lg">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Thêm danh mục</h5>
      </div>
      <div class="card-body">
        <form>
          <div class="mb-3">
            <label for="categoryName" class="form-label fw-bold">Tên danh mục</label>
            <input type="text" id="categoryName" class="form-control" placeholder="Nhập tên danh mục" required />
          </div>
  
          <div class="mb-3">
            <label for="categoryDescription" class="form-label fw-bold">Mô tả</label>
            <textarea id="categoryDescription" class="form-control" rows="3" placeholder="Nhập mô tả danh mục"></textarea>
          </div>
  
          <div class="mb-3">
            <label for="categoryStatus" class="form-label fw-bold">Trạng thái</label>
            <select id="categoryStatus" class="form-select">
              <option value="active">Hoạt động</option>
              <option value="inactive">Không hoạt động</option>
            </select>
          </div>
  
          <div class="text-end">
            <button type="reset" class="btn btn-outline-secondary">Hủy</button>
            <button type="submit" class="btn btn-primary">Thêm</button>
          </div>
        </form>
      </div>
    </div>
  </div>
