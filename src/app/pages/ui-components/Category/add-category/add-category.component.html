<div class="container mt-4">
  <div class="card shadow-lg">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Thêm danh mục</h5>
    </div>
    <div class="card-body">
      <form>
        <div class="mb-3">
          <label for="categoryName" class="form-label fw-bold">Tên danh mục</label>
          <input type="text" id="categoryName" class="form-control" placeholder="Nhập tên danh mục" required />
        </div>

        <div class="text-end">
          <button type="reset" class="btn btn-outline-secondary me-2">Hủy</button>
          <button type="submit" class="btn btn-primary">Thêm</button>
        </div>
      </form>
    </div>
  </div>
</div>
