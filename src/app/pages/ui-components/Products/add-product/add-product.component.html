<mat-card class="cardWithShadow">
  <mat-card-content>
    <mat-card-title>Thêm Danh Mục Gốm</mat-card-title>

    <div class="form-group">
      <label for="image">Hình</label>
      <input type="file" id="image" accept="image/*" (change)="previewImage($event)">
      <img [src]="imagePreview" class="preview" alt="Xem trước hình">
      <div class="error" *ngIf="errors.imageFile">{{ errors.imageFile }}</div>
    </div>

    <div class="form-group">
      <label for="name">Tên</label>
      <input matInput type="text" id="name" [(ngModel)]="productName">
      <div class="error" *ngIf="errors.productName">{{ errors.productName }}</div>
    </div>

    <div class="form-group">
      <label for="description">Mô tả</label>
      <textarea matInput id="description" [(ngModel)]="productDescription"></textarea>
      <div class="error" *ngIf="errors.productDescription">{{ errors.productDescription }}</div>
    </div>

    <div class="form-group">
      <label for="price">Giá</label>
      <input matInput type="number" id="price" [(ngModel)]="productPrice">
      <div class="error" *ngIf="errors.productPrice">{{ errors.productPrice }}</div>
    </div>

    <div class="form-group">
      <label for="category">Thể Loại</label>
      <mat-select id="category" [(ngModel)]="productCategory">
        <mat-option value="trinh_tham">Trinh Thám</mat-option>
        <mat-option value="khoa_hoc">Khoa Học Viễn Tưởng</mat-option>
        <mat-option value="phieu_luu">Phiêu Lưu</mat-option>
      </mat-select>
      <div class="error" *ngIf="errors.productCategory">{{ errors.productCategory }}</div>
    </div>

    <div class="form-group">
      <label for="status">Trạng Thái</label>
      <mat-select id="status" [(ngModel)]="productStatus">
        <mat-option value="con_hang">Còn Hàng</mat-option>
        <mat-option value="het_hang">Hết Hàng</mat-option>
      </mat-select>
      <div class="error" *ngIf="errors.productStatus">{{ errors.productStatus }}</div>
    </div>

    <button mat-raised-button color="primary" (click)="addCategory()">Thêm Danh Mục</button>
  </mat-card-content>
</mat-card>
