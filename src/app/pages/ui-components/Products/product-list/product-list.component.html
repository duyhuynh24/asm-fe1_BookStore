<mat-card class="shadow-sm border-light mt-4">
  <mat-card-header class="bg-success text-white text-center">
    <mat-card-title>
      <h5 class="mb-0 text-uppercase" style="letter-spacing: 1px;">Quản Lý Sản Phẩm</h5>
    </mat-card-title>
  </mat-card-header>

  <mat-card-content class="p-4">
    <!-- Bộ lọc -->
    <div class="mb-3">
      <label class="form-label fw-bold">Nhập Tên sản phẩm:</label>
      <input matInput placeholder="Tìm sản phẩm..." [(ngModel)]="filterValue" (keyup.enter)="applyFilter()" class="form-control">
      <small class="text-muted">Tên đã nhập: <strong>{{ filterValue }}</strong></small>
    </div>

    <!-- Nếu không có dữ liệu -->
    <div *ngIf="dataSource.filteredData.length === 0" class="text-center text-muted my-4">
      <p>Không có sản phẩm nào.</p>
    </div>

    <!-- Bảng danh sách sản phẩm -->
    <div class="table-responsive" *ngIf="dataSource.filteredData.length > 0">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z1 w-100">

        <!-- Sản phẩm -->
        <ng-container matColumnDef="product">
          <th mat-header-cell *matHeaderCellDef class="fw-bold">Sản phẩm</th>
          <td mat-cell *matCellDef="let element">
            <div class="d-flex align-items-center">
              <img [src]="'assets/images/products/' + element.image" alt="sản phẩm" width="60" class="rounded shadow-sm" />

              <div class="ms-3">
                <h6 class="mb-0 text-success fw-bold">{{ element.name }}</h6>
                <p class="mb-0 text-muted">{{ element.description }}</p>
              </div>
            </div>
          </td>
        </ng-container>

        <!-- Giá -->
        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef class="fw-bold">Giá</th>
          <td mat-cell *matCellDef="let element">
            {{ element.price | number:'1.0-0' }} đ

          </td>
        </ng-container>

        <!-- Số lượng -->
        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef class="fw-bold">Số lượng</th>
          <td mat-cell *matCellDef="let element">
            {{ element.stock }}
          </td>
        </ng-container>

        <!-- Loại -->
        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef class="fw-bold">Loại</th>
          <td mat-cell *matCellDef="let element">
            {{ element.categoryId }}
          </td>
        </ng-container>

        <!-- Hành động -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button [matMenuTriggerFor]="menu">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="onEditProduct(element.id)">
                <mat-icon>edit</mat-icon>
                <span>Chỉnh sửa</span>
              </button>
              <button mat-menu-item (click)="onDeleteProduct(element.id)">
                <mat-icon>delete</mat-icon>
                <span>Xóa</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <!-- Phân trang -->
      <mat-paginator [pageSize]="4" [pageSizeOptions]="[4, 8, 12]" showFirstLastButtons></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
