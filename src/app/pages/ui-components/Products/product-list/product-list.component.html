<mat-card class="cardWithShadow">
  <mat-card-content>
    <mat-card-title>Danh sách sách</mat-card-title>

    <div class="table-responsive">
      <table mat-table [dataSource]="dataSource" class="w-100">
        <!-- Cột Sách -->
        <ng-container matColumnDef="product">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14 p-l-0"> Sách </th>
          <td mat-cell *matCellDef="let element" class="p-l-0">
            <div class="d-flex align-items-center">
              <img [src]="element.imagePath" alt="Bìa sách" width="60" class="rounded" />
              <div class="m-l-16">
                <h6 class="f-s-14 f-w-600"> {{ element.title }} </h6>
              </div>
            </div>
          </td>
        </ng-container>

        <!-- Cột Mô tả -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14"> Mô tả </th>
          <td mat-cell *matCellDef="let element">
            <p class="f-s-12 text-muted">{{ element.description }}</p>
          </td>
        </ng-container>

        <!-- Cột Giá -->
        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14"> Giá (VNĐ) </th>
          <td mat-cell *matCellDef="let element">
            <h6 class="f-s-16"><span class="text-dark f-w-600">{{ element.price | currency:'VND' }}</span></h6>
          </td>
        </ng-container>

        <!-- Cột Tồn kho -->
        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14"> Tồn kho </th>
          <td mat-cell *matCellDef="let element">
            <span class="f-w-600 f-s-14" [ngClass]="{
                'text-success': element.stock > 0,
                'text-danger': element.stock === 0
              }">
              {{ element.stock > 0 ? element.stock + ' còn hàng' : 'Hết hàng' }}
            </span>
          </td>
        </ng-container>

        <!-- Cột Danh mục -->
        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14"> Danh mục </th>
          <td mat-cell *matCellDef="let element">
            <span class="badge bg-primary text-white f-w-600">{{ element.category }}</span>
          </td>
        </ng-container>

        <!-- Cột Trạng thái -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14"> Trạng thái </th>
          <td mat-cell *matCellDef="let element">
            <span [ngClass]="{
                'bg-light-success text-success': element.status === 'Còn hàng',
                'bg-light-warning text-warning': element.status === 'Hết hàng'
              }"
                  class="rounded f-w-600 p-6 p-y-4 f-s-12">
              {{ element.status }}
            </span>
          </td>
        </ng-container>

        <!-- Cột Hành động -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14"> Hành động </th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Hành động">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item [routerLink]="['../products/edit', element.id]">
                <mat-icon>edit</mat-icon>
                <span>Chỉnh sửa</span>
              </button>
              <button mat-menu-item (click)="deleteProduct(element.id)">
                <mat-icon>delete</mat-icon>
                <span>Xóa</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
