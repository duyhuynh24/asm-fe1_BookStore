<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Quản lý bài viết</h5>
    </div>
    <div class="card-body">
      <form [formGroup]="formData" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="title" class="form-label fw-bold">Tiêu đề</label>
          <input type="text" class="form-control" id="title" formControlName="title" placeholder="Nhập tiêu đề">
          <span class="text-danger" *ngIf="(title!.invalid && (title!.dirty || title!.touched))">Vui lòng nhập tiêu đề</span>
        </div>

        <div class="mb-3">
          <label for="content" class="form-label fw-bold">Nội dung</label>
          <textarea class="form-control" id="content" rows="3" formControlName="content" placeholder="Nhập nội dung"></textarea>
          <span class="text-danger" *ngIf="(content!.invalid && (content!.dirty || content!.touched))">Vui lòng nhập nội dung</span>
        </div>

        <div class="mb-3">
          <label for="image" class="form-label fw-bold">Ảnh đại diện</label>
          <input type="file" class="form-control" id="image" formControlName="image">
          <span class="text-danger" *ngIf="(image!.invalid && (image!.dirty || image!.touched))">Vui lòng thêm hình ảnh</span>
        </div>

        <div class="mb-3">
          <label for="category" class="form-label fw-bold">Danh mục</label>
          <select class="form-select" id="category" formControlName="category">
            <option value="" disabled selected>Chọn danh mục</option>
            <option value="tech">Công nghệ</option>
            <option value="lifestyle">Đời sống</option>
            <option value="business">Kinh doanh</option>
          </select>
          <span class="text-danger" *ngIf="(category!.invalid && (category!.dirty || category!.touched))">Vui lòng chọn danh mục</span>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary" [disabled]="!formData.valid">Gửi bài viết</button>
        </div>
      </form>
    </div>
  </div>
</div>
