<!-- Tiêu đề -->
<div class="col-lg-12">
  <mat-label class="f-w-600 m-b-8 d-block">Tiêu đề</mat-label>
  <mat-form-field appearance="outline" class="w-100">
    <input matInput id="title" formControlName="title" type="text" placeholder="Nhập tiêu đề" />
  </mat-form-field>
  <div *ngIf="postForm.controls['title'].invalid && postForm.controls['title'].touched">
    <small *ngIf="postForm.controls['title'].errors?.['required']">Tiêu đề là bắt buộc.</small>
    <small *ngIf="postForm.controls['title'].errors?.['minlength']">Tiêu đề tối thiểu 5 ký tự.</small>
  </div>
</div>

<!-- Nội dung -->
<div class="col-lg-12">
  <mat-label class="f-w-600 m-b-8 d-block">Nội dung</mat-label>
  <mat-form-field appearance="outline" class="w-100">
    <textarea matInput id="content" formControlName="content" placeholder="Nhập nội dung"></textarea>
  </mat-form-field>
  <div *ngIf="postForm.controls['content'].invalid && postForm.controls['content'].touched">
    <small *ngIf="postForm.controls['content'].errors?.['required']">Nội dung là bắt buộc.</small>
    <small *ngIf="postForm.controls['content'].errors?.['minlength']">Nội dung tối thiểu 20 ký tự.</small>
  </div>
</div>

<!-- Danh mục -->
<div class="col-lg-12 mt-lg-3">
  <mat-label class="f-w-600 m-b-8 d-block">Danh mục</mat-label>
  <mat-form-field appearance="outline" class="w-100">
    <mat-select id="category" formControlName="category">
      <mat-option value="" disabled>Chọn danh mục</mat-option>
      <mat-option value="tech">Công nghệ</mat-option>
      <mat-option value="lifestyle">Đời sống</mat-option>
      <mat-option value="business">Kinh doanh</mat-option>
    </mat-select>
  </mat-form-field>
  <div *ngIf="postForm.controls['category'].invalid && postForm.controls['category'].touched">
    <small>Vui lòng chọn danh mục.</small>
  </div>
</div>
